name: bilby
description: Travel eSIM. Set it up at home, land connected.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2

  # Hands the LPA activation string to the system eSIM installer via a
  # universal link. Deliberately not a native eSIM plugin — see esim_service.dart.
  url_launcher: ^6.3.1

  # Persists the anonymous session cookie across launches. The whole product
  # depends on a user keeping their identity without ever making an account.
  shared_preferences: ^2.3.3

# google_mobile_ads was removed with the free tier. Worth knowing why it is not
# merely unused: the SDK crashes at startup unless AndroidManifest declares
# com.google.android.gms.ads.APPLICATION_ID, so keeping a dead dependency would
# have kept a manifest requirement and a whole class of build failures alive for
# a feature that no longer exists.
#
# Haptics come from package:flutter/services.dart, which ships with the SDK, so
# no dependency is needed for them.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # No assets/ block: there are no bundled assets, and declaring a directory
  # that does not exist is a hard build failure rather than a warning.
  # Launcher icons live in android/app/src/main/res, not here.
