org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false

# Release shrinking. See app/build.gradle.kts.
#
# A build made with -Pbilby.shrink=false is a DIAGNOSTIC BUILD and must never
# reach Play. It gets a versionNameSuffix so an unshrunk artifact identifies
# itself in the Play Console rather than relying on anyone remembering.
bilby.shrink=true
